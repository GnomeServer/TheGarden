name: llama                                                                            
                                                                                       
services:                                                                              
  llama:                                                                               
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}                           
    restart: unless-stopped                                                            
    command:                                                                           
      - -m                                                                             
      - /models/${LLAMA_MODEL:?Set LLAMA_MODEL in .env}                                
      - --host                                                                         
      - 0.0.0.0                                                                        
      - --port                                                                         
      - "8080"                                                                         
      - -c                                                                             
      - "${LLAMA_CONTEXT_SIZE:-4096}"                                                  
      - -t                                                                             
      - "${LLAMA_THREADS:-5}"                                                          
      - -ngl                                                                           
      - "0"                                                                            
      - -np                                                                            
      - "1"                                                                            
      - --jinja                                                                        
      - --api-key                                                                      
      - ${LLAMA_API_KEY:?Set LLAMA_API_KEY in .env}                                    
    volumes:                                                                           
      - ./models:/models:ro                                                            
    expose:                                                                            
      - "8080"                                                                         
    networks:                                                                          
      - caddy_proxy                                                                    
                                                                                       
networks:                                                                              
  caddy_proxy:                                                                         
    external: true                                                                     
    name: caddy_proxy
