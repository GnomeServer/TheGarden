name: open-webui

services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai_internal

  open-webui:
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:latest}
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_URL: ${OPEN_WEBUI_URL:-https://infra-lab-services.tail494f6d.ts.net:8443/}
      ENABLE_SIGNUP: ${OPEN_WEBUI_ENABLE_SIGNUP:-true}
    volumes:
      - open_webui_data:/app/backend/data
    networks:
      - caddy_proxy
      - ai_internal

networks:
  caddy_proxy:
    external: true
    name: caddy_proxy
  ai_internal:
    name: open-webui_internal

volumes:
  ollama_data:
    name: open-webui_ollama_data
  open_webui_data:
    name: open-webui_data
