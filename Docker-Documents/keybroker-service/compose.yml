name: keybroker

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keybroker}
      POSTGRES_USER: ${POSTGRES_USER:-keybroker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - keybroker_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-keybroker} -d ${POSTGRES_DB:-keybroker}
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - keybroker_internal

  keybroker:
    build: .
    image: ${KEYBROKER_IMAGE:-local/keybroker:dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      KEYBROKER_DB_HOST: postgres
      KEYBROKER_DB_PORT: "5432"
      KEYBROKER_DB_NAME: ${POSTGRES_DB:-keybroker}
      KEYBROKER_DB_USER: ${POSTGRES_USER:-keybroker}
      KEYBROKER_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KEYBROKER_LITELLM_BASE_URL: ${KEYBROKER_LITELLM_BASE_URL:-http://litellm:4000}
      KEYBROKER_LITELLM_MASTER_KEY: ${KEYBROKER_LITELLM_MASTER_KEY:?Set KEYBROKER_LITELLM_MASTER_KEY in .env}
      KEYBROKER_DASHBOARD_TOKEN: ${KEYBROKER_DASHBOARD_TOKEN:?Set KEYBROKER_DASHBOARD_TOKEN in .env}
      KEYBROKER_PROXY_TOKEN: ${KEYBROKER_PROXY_TOKEN:?Set KEYBROKER_PROXY_TOKEN in .env}
      KEYBROKER_EXPOSURE_WEBHOOK_URL: ${KEYBROKER_EXPOSURE_WEBHOOK_URL:-http://api-guard:8000/api-guard/api/v1/webhooks/exposure}
      KEYBROKER_EXPOSURE_WEBHOOK_SECRET: ${KEYBROKER_EXPOSURE_WEBHOOK_SECRET:?Set KEYBROKER_EXPOSURE_WEBHOOK_SECRET in .env}
      KEYBROKER_MODEL_BASE_URL: ${KEYBROKER_MODEL_BASE_URL:-https://infra-lab-services.tail494f6d.ts.net/litellm/v1}
      KEYBROKER_DEFAULT_MODEL: ${KEYBROKER_DEFAULT_MODEL:-luna}
      KEYBROKER_ALLOWED_MODELS: ${KEYBROKER_ALLOWED_MODELS:-["luna"]}
      KEYBROKER_SESSION_MAX_BUDGET_USD: ${KEYBROKER_SESSION_MAX_BUDGET_USD:-25}
      KEYBROKER_SESSION_TTL_SECONDS: ${KEYBROKER_SESSION_TTL_SECONDS:-3600}
      KEYBROKER_REAPER_INTERVAL_SECONDS: ${KEYBROKER_REAPER_INTERVAL_SECONDS:-60}
      KEYBROKER_ADMIN_MAX_BUDGET_USD: ${KEYBROKER_ADMIN_MAX_BUDGET_USD:-25000}
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - keybroker_internal
      - caddy_proxy

networks:
  keybroker_internal:
    name: keybroker_internal
  caddy_proxy:
    external: true
    name: caddy_proxy

volumes:
  keybroker_postgres_data:
    name: keybroker_postgres_data
