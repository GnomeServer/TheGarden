name: api-guard-dashboard

services:
  api-guard:
    build: .
    image: ${API_GUARD_IMAGE:-local/api-guard-dashboard:dev}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      API_GUARD_STATE_DB: /data/api-guard.sqlite3
      API_GUARD_PUBLIC_URL: ${API_GUARD_PUBLIC_URL:?Set API_GUARD_PUBLIC_URL}
      API_GUARD_SESSION_SECRET: ${API_GUARD_SESSION_SECRET:?Set API_GUARD_SESSION_SECRET}
      API_GUARD_SESSION_SECURE: ${API_GUARD_SESSION_SECURE:-true}
      API_GUARD_ADMINS: ${API_GUARD_ADMINS:?Set API_GUARD_ADMINS}
      API_GUARD_FORGEJO_API_URL: ${API_GUARD_FORGEJO_API_URL:-http://forgejo:3000/api/v1}
      API_GUARD_FORGEJO_PUBLIC_URL: ${API_GUARD_FORGEJO_PUBLIC_URL:?Set API_GUARD_FORGEJO_PUBLIC_URL}
      API_GUARD_FORGEJO_CLIENT_ID: ${API_GUARD_FORGEJO_CLIENT_ID:?Set API_GUARD_FORGEJO_CLIENT_ID}
      API_GUARD_FORGEJO_CLIENT_SECRET: ${API_GUARD_FORGEJO_CLIENT_SECRET:?Set API_GUARD_FORGEJO_CLIENT_SECRET}
      API_GUARD_LITELLM_BASE_URL: ${API_GUARD_LITELLM_BASE_URL:-http://litellm:4000}
      API_GUARD_KEYBROKER_BASE_URL: ${API_GUARD_KEYBROKER_BASE_URL:-http://keybroker:8000}
      KEYBROKER_DASHBOARD_TOKEN: ${KEYBROKER_DASHBOARD_TOKEN:?Set KEYBROKER_DASHBOARD_TOKEN}
      API_GUARD_ALERT_WEBHOOK_URL: ${API_GUARD_ALERT_WEBHOOK_URL:-}
      API_GUARD_ALERT_WEBHOOK_SECRET: ${API_GUARD_ALERT_WEBHOOK_SECRET:-}
      API_GUARD_EXPOSURE_WEBHOOK_SECRET: ${API_GUARD_EXPOSURE_WEBHOOK_SECRET:?Set API_GUARD_EXPOSURE_WEBHOOK_SECRET}
      API_GUARD_OPENAI_ADMIN_API_KEY: ${API_GUARD_OPENAI_ADMIN_API_KEY:-}
      API_GUARD_OPENAI_PROJECT_ID: ${API_GUARD_OPENAI_PROJECT_ID:-}
      API_GUARD_ANNUAL_BUDGET_USD: ${API_GUARD_ANNUAL_BUDGET_USD:-25000}
      API_GUARD_ROTATION_DAYS: ${API_GUARD_ROTATION_DAYS:-14}
      API_GUARD_JEV_MODEL: ${API_GUARD_JEV_MODEL:-jev}
      API_GUARD_JEV_API_KEY: ${API_GUARD_JEV_API_KEY:-}
    volumes:
      - api_guard_data:/data
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - caddy_proxy

networks:
  caddy_proxy:
    external: true
    name: caddy_proxy

volumes:
  api_guard_data:
    name: api-guard-dashboard_api_guard_data
