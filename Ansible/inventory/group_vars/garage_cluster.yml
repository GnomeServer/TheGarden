---
# Garage must use one replication factor and one RPC secret on every node.
# Two nodes are useful for redundancy, but Garage recommends three or more
# nodes for a cluster that can keep accepting writes during a node failure.
garage_replication_factor: 2
garage_consistency_mode: consistent

# Layout changes are staged and applied by the first host in garage_cluster.
# Run the play against the complete group; do not use --limit for this play.
garage_manage_layout: true
garage_layout_require_all_hosts: true

# The existing lab metadata was created with SQLite. Keep it for an in-place
# deployment; migrate to LMDB separately after taking a backup and following
# Garage's convert-db procedure.
garage_db_engine: sqlite

# RPC and S3 are reachable over the Tailscale address recorded for each host.
# The admin API remains local-only because it is not needed by S3 clients.
garage_rpc_bind_addr: "{{ host_tailscale_address }}:{{ garage_rpc_port }}"
garage_s3_bind_addr: "{{ host_tailscale_address }}:{{ garage_s3_port }}"
garage_admin_bind_addr: "127.0.0.1:{{ garage_admin_port }}"
