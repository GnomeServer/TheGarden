---
garage_version: "v2.4.1"
garage_binary_base_url: "https://garagehq.deuxfleurs.fr/_releases"

garage_architecture_platforms:
  x86_64: x86_64-unknown-linux-musl
  aarch64: aarch64-unknown-linux-musl
  armv6l: armv6l-unknown-linux-musleabihf
  i386: i686-unknown-linux-musl

garage_binary_checksums:
  # SHA-256 of the official v2.4.1 x86_64 musl release.
  x86_64: "sha256:ae49f8de4aaee6b5ca305f7cbdccc8cd8a29b2804aac074649f18bfb83d0a2b6"

garage_binary_platform: "{{ garage_architecture_platforms[ansible_facts.architecture] }}"
garage_binary_url: "{{ garage_binary_base_url }}/{{ garage_version }}/{{ garage_binary_platform }}/garage"
garage_binary_checksum: "{{ garage_binary_checksums.get(ansible_facts.architecture, '') }}"
garage_binary_path: "/usr/local/bin/garage"

garage_config_path: "/etc/garage.toml"
garage_data_dir: "/var/lib/garage/data"
garage_meta_dir: "/var/lib/garage/meta"
garage_rpc_secret_file: "/etc/garage/rpc_secret"
garage_admin_token_file: "/etc/garage/admin_token"

garage_rpc_port: 3901
garage_s3_port: 3900
garage_admin_port: 3903

garage_db_engine: sqlite
garage_consistency_mode: consistent
garage_metadata_auto_snapshot_interval: 6h
garage_compression_level: 1

garage_rpc_bind_addr: "[::]:{{ garage_rpc_port }}"
garage_rpc_public_addr: "{{ host_tailscale_address }}:{{ garage_rpc_port }}"
garage_s3_bind_addr: "[::]:{{ garage_s3_port }}"
garage_s3_region: garage
garage_s3_root_domain: ""
garage_admin_bind_addr: "127.0.0.1:{{ garage_admin_port }}"

garage_service_user: garage
garage_service_group: garage

garage_cluster_group: garage_cluster
garage_manage_layout: false
garage_layout_require_all_hosts: true
# These values are intentionally required in host_vars so capacity and zones
# are reviewed for every storage node instead of silently using a fake default.
garage_node_zone: ""
garage_node_capacity: ""
garage_node_tag: "{{ inventory_hostname }}"

garage_local_cache_dir: "{{ lookup('env', 'HOME') }}/.cache/ansible-garage"
garage_local_cache_path: "{{ garage_local_cache_dir }}/garage-{{ garage_version }}-{{ garage_binary_platform }}"
garage_secrets_dir: "{{ lookup('env', 'HOME') }}/.ansible-secrets"
garage_rpc_secret: "{{ lookup('ansible.builtin.password', garage_secrets_dir + '/garage_rpc_secret', length=64, chars='0123456789abcdef') }}"
garage_admin_token: "{{ lookup('ansible.builtin.password', garage_secrets_dir + '/garage_admin_token', length=64, chars='0123456789abcdef') }}"
