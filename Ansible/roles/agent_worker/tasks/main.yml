---
- name: Require worker identity and fixed control-plane network configuration
  ansible.builtin.assert:
    that:
      - worker_id is defined
      - worker_id | length > 0
      - worker_role is defined
      - worker_role | length > 0
      - worker_control_plane_ip == '100.94.49.45'
      - worker_control_plane_hostname == 'infra-lab-services.tail494f6d.ts.net'
      - worker_nats_url is match('^nats://100[.]94[.]49[.]45:4222$')
      - worker_keybroker_base_url is match('^https://infra-lab-services[.]tail494f6d[.]ts[.]net/keybroker/?$')
    fail_msg: "Set worker_id and worker_role, and keep NATS and Keybroker on the configured control-plane service endpoint for {{ inventory_hostname }}."

- name: Install Python, cron, process-management tools, and CA certificates
  ansible.builtin.apt:
    name:
      - ca-certificates
      - procps
      - cron
      - python3
      - python3-venv
    state: present
  become: true

- name: Create worker directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user_id }}"
    mode: "0700"
  loop:
    - "{{ ansible_user_dir }}/agent-worker"
    - "{{ ansible_user_dir }}/agent-workspace"
    - "{{ ansible_user_dir }}/.config/litellm"

- name: Check Caddy root CA on the controller
  ansible.builtin.stat:
    path: "{{ caddy_root_ca_source }}"
  delegate_to: localhost
  register: caddy_root_ca_source_stat

- name: Require the Caddy root CA for worker HTTPS access
  ansible.builtin.assert:
    that:
      - caddy_root_ca_source_stat.stat.exists
      - caddy_root_ca_source_stat.stat.isreg
    fail_msg: >-
      Export the active Caddy root certificate to {{ caddy_root_ca_source }}
      with scripts/export_caddy_root_ca.sh before deploying the worker.

- name: Install the Caddy root CA for worker HTTPS requests
  ansible.builtin.copy:
    src: "{{ caddy_root_ca_source }}"
    dest: "{{ ansible_user_dir }}/.config/litellm/caddy-root.crt"
    owner: "{{ ansible_user_id }}"
    mode: "0644"
  notify: Restart agent worker

- name: Install worker source
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../agent-worker/{{ item }}"
    dest: "{{ ansible_user_dir }}/agent-worker/{{ item }}"
    owner: "{{ ansible_user_id }}"
    mode: "0644"
  loop:
    - worker.py
    - requirements.txt
  notify: Restart agent worker

- name: Remove the retired in-process mission module
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/agent-worker/mission.py"
    state: absent

- name: Install OMP job image build context
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../agent-worker/omp-image/"
    dest: "{{ ansible_user_dir }}/agent-worker/omp-image/"
    owner: "{{ ansible_user_id }}"
    mode: preserve
  register: omp_image_source_copy
  notify: Restart agent worker

- name: Check whether the OMP job image exists
  ansible.builtin.command:
    argv:
      - docker
      - image
      - inspect
      - "{{ worker_omp_image }}"
  register: omp_worker_image_info
  changed_when: false
  failed_when: false

- name: Build the OMP job image
  ansible.builtin.command:
    argv:
      - docker
      - build
      - --pull
      - --tag
      - "{{ worker_omp_image }}"
      - "{{ ansible_user_dir }}/agent-worker/omp-image"
  when: omp_image_source_copy.changed or omp_worker_image_info.rc != 0
  notify: Restart agent worker


- name: Install worker Python dependencies
  ansible.builtin.pip:
    requirements: "{{ ansible_user_dir }}/agent-worker/requirements.txt"
    virtualenv: "{{ ansible_user_dir }}/agent-worker/.venv"
    virtualenv_command: python3 -m venv

- name: Install worker environment
  ansible.builtin.template:
    src: worker.env.j2
    dest: "{{ ansible_user_dir }}/agent-worker/worker.env"
    owner: "{{ ansible_user_id }}"
    mode: "0600"
  notify: Restart agent worker

- name: Install worker start script
  ansible.builtin.template:
    src: start-worker.sh.j2
    dest: "{{ ansible_user_dir }}/agent-worker/start-worker.sh"
    owner: "{{ ansible_user_id }}"
    mode: "0700"
  notify: Restart agent worker

- name: Check that the public Caddy root certificate is staged on the controller
  ansible.builtin.stat:
    path: /tmp/thegarden-caddy-root.crt
  register: caddy_root_certificate
  delegate_to: localhost
  run_once: true

- name: Require the public Caddy root certificate before Keybroker cutover
  ansible.builtin.assert:
    that:
      - caddy_root_certificate.stat.exists
      - caddy_root_certificate.stat.isreg
    fail_msg: "Copy Caddy's public root.crt to /tmp/thegarden-caddy-root.crt on the Ansible controller. Never copy root.key."
  run_once: true

- name: Install Caddy root CA on the worker
  ansible.builtin.copy:
    src: "{{ caddy_root_ca_source }}"
    dest: /usr/local/share/ca-certificates/thegarden-caddy-root.crt
    owner: root
    group: root
    mode: "0644"
  become: true
  register: worker_system_ca_copy
  when: worker_keybroker_base_url is match('^https://') or worker_model_base_url is match('^https://')

- name: Refresh worker CA trust store
  ansible.builtin.command: update-ca-certificates
  become: true
  changed_when: false
  when:
    - (worker_keybroker_base_url is match('^https://') or worker_model_base_url is match('^https://'))
    - worker_system_ca_copy.changed

- name: Map the Keybroker hostname directly to the control-plane IP
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^\s*[^#].*\s{{ worker_control_plane_hostname | regex_escape }}(\s|$)'
    line: "{{ worker_control_plane_ip }} {{ worker_control_plane_hostname }}"
    state: present
  become: true
  notify: Restart agent worker

- name: Verify Keybroker is ready before removing static worker keys
  ansible.builtin.uri:
    url: "{{ worker_keybroker_base_url.rstrip('/') }}/healthz"
    method: GET
    status_code: 200
    ca_path: /usr/local/share/ca-certificates/thegarden-caddy-root.crt
    validate_certs: true

- name: Verify Keybroker recognizes this worker before removing its static key
  ansible.builtin.uri:
    url: "{{ worker_keybroker_base_url.rstrip('/') }}/v1/worker/identity"
    method: GET
    status_code: 200
    ca_path: /usr/local/share/ca-certificates/thegarden-caddy-root.crt
    validate_certs: true
  register: worker_keybroker_identity
  failed_when: >-
    worker_keybroker_identity.status != 200 or
    worker_keybroker_identity.json is not mapping or
    worker_keybroker_identity.json.get('worker_id', '') != worker_id

- name: Check whether the one-time Keybroker cutover marker exists
  ansible.builtin.stat:
    path: /var/lib/dark-factory-agent-worker/keybroker-cutover-v1
  register: worker_keybroker_cutover

- name: Remove the legacy reboot cron entry
  ansible.builtin.cron:
    name: thegarden-agent-worker
    special_time: reboot
    state: absent
  become: true

- name: Check whether the systemd worker service is active
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - --quiet
      - dark-factory-agent-worker.service
  register: worker_service_active
  changed_when: false
  failed_when: false

- name: Stop the systemd worker before the first Keybroker cutover
  ansible.builtin.systemd_service:
    name: dark-factory-agent-worker.service
    state: stopped
  become: true
  when:
    - not worker_keybroker_cutover.stat.exists
    - ansible_facts['service_mgr'] == 'systemd'
    - worker_service_active.rc == 0

- name: Stop a legacy worker process before systemd takes over
  ansible.builtin.command:
    argv:
      - pkill
      - --signal
      - TERM
      - --uid
      - "{{ ansible_user_id }}"
      - --full
      - --
      - "{{ ansible_user_dir }}/agent-worker/(start-worker\\.sh|worker\\.py)"
  register: legacy_worker_stop
  changed_when: legacy_worker_stop.rc == 0
  failed_when: legacy_worker_stop.rc not in [0, 1]
  when:
    - not worker_keybroker_cutover.stat.exists
    - worker_service_active.rc != 0

- name: Verify no legacy worker process remains before deleting its key
  ansible.builtin.command:
    argv:
      - pgrep
      - -u
      - "{{ ansible_user_id }}"
      - -f
      - "{{ ansible_user_dir }}/agent-worker/[w]orker\\.py"
  register: legacy_worker_process
  retries: 10
  delay: 1
  until: legacy_worker_process.rc == 1
  failed_when: legacy_worker_process.rc != 1
  changed_when: false
  when: not worker_keybroker_cutover.stat.exists

- name: Verify no legacy worker launcher remains before deleting its key
  ansible.builtin.command:
    argv:
      - pgrep
      - -u
      - "{{ ansible_user_id }}"
      - -f
      - "{{ ansible_user_dir }}/agent-worker/[s]tart-worker\\.sh"
  register: legacy_worker_launcher
  retries: 10
  delay: 1
  until: legacy_worker_launcher.rc == 1
  failed_when: legacy_worker_launcher.rc != 1
  changed_when: false
  when: not worker_keybroker_cutover.stat.exists

- name: Remove the obsolete long-lived worker LiteLLM key
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/litellm/worker-api-key"
    state: absent
  no_log: true
  when: not worker_keybroker_cutover.stat.exists

- name: Create worker cutover marker directory
  ansible.builtin.file:
    path: /var/lib/dark-factory-agent-worker
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: not worker_keybroker_cutover.stat.exists

- name: Record completion of the one-time Keybroker cutover
  ansible.builtin.file:
    path: /var/lib/dark-factory-agent-worker/keybroker-cutover-v1
    state: touch
    owner: root
    group: root
    mode: "0644"
  become: true
  when: not worker_keybroker_cutover.stat.exists

- name: Install the supervised worker systemd unit
  ansible.builtin.template:
    src: dark-factory-agent-worker.service.j2
    dest: /etc/systemd/system/dark-factory-agent-worker.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Reload systemd daemon
    - Restart agent worker

- name: Enable and start the worker service
  ansible.builtin.systemd_service:
    name: dark-factory-agent-worker.service
    enabled: true
    state: started
    daemon_reload: true
  become: true
