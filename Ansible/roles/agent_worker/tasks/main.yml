---
- name: Require a worker id and role
  ansible.builtin.assert:
    that:
      - worker_id is defined
      - worker_id | length > 0
      - worker_role is defined
      - worker_role | length > 0
    fail_msg: "Set worker_id and worker_role for {{ inventory_hostname }} before running this playbook."


- name: Install Python, virtualenv, cron, and CA certificates
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3
      - python3-venv
      - cron
    state: present
  become: true
- name: Create worker directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user_id }}"
    mode: "0700"
  loop:
    - "{{ ansible_user_dir }}/agent-worker"
    - "{{ ansible_user_dir }}/agent-workspace"
    - "{{ ansible_user_dir }}/.config"
    - "{{ ansible_user_dir }}/.config/litellm"

- name: Install worker source
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../agent-worker/{{ item }}"
    dest: "{{ ansible_user_dir }}/agent-worker/{{ item }}"
    owner: "{{ ansible_user_id }}"
    mode: "0644"
  loop:
    - worker.py
    - mission.py
    - requirements.txt

- name: Create the worker virtualenv
  ansible.builtin.command:
    cmd: python3 -m venv {{ ansible_user_dir }}/agent-worker/.venv
    creates: "{{ ansible_user_dir }}/agent-worker/.venv/bin/python"

- name: Install worker Python dependencies
  ansible.builtin.command:
    cmd: "{{ ansible_user_dir }}/agent-worker/.venv/bin/python -m pip install -r {{ ansible_user_dir }}/agent-worker/requirements.txt"

- name: Install worker environment
  ansible.builtin.template:
    src: worker.env.j2
    dest: "{{ ansible_user_dir }}/agent-worker/worker.env"
    owner: "{{ ansible_user_id }}"
    mode: "0600"

- name: Install worker start script
  ansible.builtin.template:
    src: start-worker.sh.j2
    dest: "{{ ansible_user_dir }}/agent-worker/start-worker.sh"
    owner: "{{ ansible_user_id }}"
    mode: "0700"

- name: Check for a LiteLLM key on the controller
  ansible.builtin.stat:
    path: "{{ litellm_key_source | default('/does-not-exist') }}"
  delegate_to: localhost
  register: litellm_key_source_stat

- name: Require a worker-scoped LiteLLM key for dynamic missions
  ansible.builtin.assert:
    that:
      - worker_model_base_url | length == 0 or (litellm_key_source_stat.stat.exists | default(false))
      - worker_model_base_url | length == 0 or (litellm_key_source_stat.stat.isreg | default(false))
    fail_msg: "Dynamic worker missions require a worker-scoped LiteLLM key file in litellm_key_source."

- name: Export Caddy root CA for the worker model endpoint
  ansible.builtin.command:
    cmd: docker cp caddy:/data/caddy/pki/authorities/local/root.crt /tmp/thegarden-caddy-root.crt
  delegate_to: localhost
  become: true
  run_once: true
  changed_when: false
  when: worker_model_base_url is match('^https://')

- name: Install the worker LiteLLM key
  ansible.builtin.copy:
    src: "{{ litellm_key_source }}"
    dest: "{{ ansible_user_dir }}/.config/litellm/worker-api-key"
    owner: "{{ ansible_user_id }}"
    mode: "0600"
  no_log: true
  when:
    - litellm_key_source is defined
    - litellm_key_source | length > 0
    - litellm_key_source_stat.stat.exists
    - litellm_key_source_stat.stat.isreg

- name: Install Caddy root CA on the worker
  ansible.builtin.copy:
    src: /tmp/thegarden-caddy-root.crt
    dest: /usr/local/share/ca-certificates/thegarden-caddy-root.crt
    owner: root
    group: root
    mode: "0644"
  become: true
  when: worker_model_base_url is match('^https://')

- name: Refresh worker CA trust store
  ansible.builtin.command: update-ca-certificates
  become: true
  changed_when: false
  when: worker_model_base_url is match('^https://')




- name: Start the worker after reboot
  ansible.builtin.cron:
    name: thegarden-agent-worker
    special_time: reboot
    job: "{{ ansible_user_dir }}/agent-worker/start-worker.sh"

- name: Start the worker now
  ansible.builtin.command:
    cmd: "{{ ansible_user_dir }}/agent-worker/start-worker.sh"
  async: 10
  poll: 0
  changed_when: false
