---
- name: Require a worker id and role
  ansible.builtin.assert:
    that:
      - worker_id is defined
      - worker_id | length > 0
      - worker_role is defined
      - worker_role | length > 0
      - worker_keybroker_base_url is defined
      - worker_keybroker_base_url is match('^https://')
      - worker_egress_allow_ips is defined
      - worker_egress_allow_ips | length > 0
      - "'0.0.0.0/0' not in worker_egress_allow_ips"
      - "'::/0' not in worker_egress_allow_ips"
    fail_msg: "Set worker_id, worker_role, an HTTPS Keybroker URL, and a non-global worker_egress_allow_ips allowlist for {{ inventory_hostname }}."


- name: Install Python, virtualenv, procps, and CA certificates
  ansible.builtin.apt:
    name:
      - ca-certificates
      - procps
      - cron
      - python3
      - python3-venv
    state: present
  become: true
- name: Create worker directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user_id }}"
    mode: "0700"
  loop:
    - "{{ ansible_user_dir }}/agent-worker"
    - "{{ ansible_user_dir }}/agent-workspace"

- name: Install worker source
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../agent-worker/{{ item }}"
    dest: "{{ ansible_user_dir }}/agent-worker/{{ item }}"
    owner: "{{ ansible_user_id }}"
    mode: "0644"
  loop:
    - worker.py
    - mission.py
    - requirements.txt
  notify: Restart dark-factory-agent-worker

- name: Create the worker virtualenv
  ansible.builtin.command:
    cmd: python3 -m venv {{ ansible_user_dir }}/agent-worker/.venv
    creates: "{{ ansible_user_dir }}/agent-worker/.venv/bin/python"

- name: Install worker Python dependencies
  ansible.builtin.command:
    cmd: "{{ ansible_user_dir }}/agent-worker/.venv/bin/python -m pip install -r {{ ansible_user_dir }}/agent-worker/requirements.txt"

- name: Install worker environment
  ansible.builtin.template:
    src: worker.env.j2
    dest: "{{ ansible_user_dir }}/agent-worker/worker.env"
    owner: "{{ ansible_user_id }}"
    mode: "0600"
  notify: Restart dark-factory-agent-worker

- name: Install worker start script
  ansible.builtin.template:
    src: start-worker.sh.j2
    dest: "{{ ansible_user_dir }}/agent-worker/start-worker.sh"
    owner: "{{ ansible_user_id }}"
    mode: "0700"
  notify: Restart dark-factory-agent-worker

- name: Check that the public Caddy root certificate is staged on the controller
  ansible.builtin.stat:
    path: /tmp/thegarden-caddy-root.crt
  register: caddy_root_certificate
  delegate_to: localhost
  run_once: true

- name: Require the public Caddy root certificate before Keybroker cutover
  ansible.builtin.assert:
    that:
      - caddy_root_certificate.stat.exists
      - caddy_root_certificate.stat.isreg
    fail_msg: "Copy Caddy's public root.crt to /tmp/thegarden-caddy-root.crt on the Ansible controller. Never copy root.key."
  run_once: true


- name: Install Caddy root CA on the worker
  ansible.builtin.copy:
    src: /tmp/thegarden-caddy-root.crt
    dest: /usr/local/share/ca-certificates/thegarden-caddy-root.crt
    owner: root
    group: root
    mode: "0644"
  become: true
  when: worker_keybroker_base_url is match('^https://')

- name: Refresh worker CA trust store
  ansible.builtin.command: update-ca-certificates
  become: true
  changed_when: false
  when: worker_keybroker_base_url is match('^https://')

- name: Verify Keybroker is ready before removing static worker keys
  ansible.builtin.uri:
    url: "{{ worker_keybroker_base_url.rstrip('/') }}/healthz"
    method: GET
    status_code: 200
    ca_path: /tmp/thegarden-caddy-root.crt
    validate_certs: true
  delegate_to: localhost
  run_once: true

- name: Verify Keybroker recognizes this worker before removing its static key
  ansible.builtin.uri:
    url: "{{ worker_keybroker_base_url.rstrip('/') }}/v1/worker/identity"
    method: GET
    status_code: 200
    ca_path: /usr/local/share/ca-certificates/thegarden-caddy-root.crt
    validate_certs: true
  register: worker_keybroker_identity
  failed_when: worker_keybroker_identity.json.worker_id != worker_id

- name: Check whether the one-time Keybroker cutover marker exists
  ansible.builtin.stat:
    path: /var/lib/dark-factory-agent-worker/keybroker-cutover-v1
  register: worker_keybroker_cutover

- name: Remove the legacy reboot cron entry
  ansible.builtin.cron:
    name: thegarden-agent-worker
    special_time: reboot
    state: absent
  become: true

- name: Stop any existing systemd worker before the first Keybroker cutover
  ansible.builtin.systemd_service:
    name: dark-factory-agent-worker.service
    state: stopped
  become: true
  failed_when: false
  changed_when: false
  when:
    - not worker_keybroker_cutover.stat.exists
    - ansible_facts['service_mgr'] == 'systemd'

- name: Stop unmanaged legacy worker launchers before the first Keybroker cutover
  ansible.builtin.shell: |
    pkill -TERM -u '{{ ansible_user_id }}' -f '{{ ansible_user_dir }}/agent-worker/[s]tart-worker\.sh' || true
    pkill -TERM -u '{{ ansible_user_id }}' -f '{{ ansible_user_dir }}/agent-worker/[w]orker\.py' || true
    sleep 1
    pkill -KILL -u '{{ ansible_user_id }}' -f '{{ ansible_user_dir }}/agent-worker/[s]tart-worker\.sh' || true
    pkill -KILL -u '{{ ansible_user_id }}' -f '{{ ansible_user_dir }}/agent-worker/[w]orker\.py' || true
  args:
    executable: /bin/bash
  changed_when: false
  when: not worker_keybroker_cutover.stat.exists

- name: Verify no legacy worker process remains before deleting its key
  ansible.builtin.command:
    argv:
      - pgrep
      - -u
      - "{{ ansible_user_id }}"
      - -f
      - "{{ ansible_user_dir }}/agent-worker/[w]orker\\.py"
  register: legacy_worker_process
  failed_when: legacy_worker_process.rc != 1
  changed_when: false
  when: not worker_keybroker_cutover.stat.exists

- name: Verify no legacy worker launcher remains before deleting its key
  ansible.builtin.command:
    argv:
      - pgrep
      - -u
      - "{{ ansible_user_id }}"
      - -f
      - "{{ ansible_user_dir }}/agent-worker/[s]tart-worker\\.sh"
  register: legacy_worker_launcher
  failed_when: legacy_worker_launcher.rc != 1
  changed_when: false
  when: not worker_keybroker_cutover.stat.exists

- name: Remove the obsolete long-lived worker LiteLLM key
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/litellm/worker-api-key"
    state: absent
  no_log: true
  when: not worker_keybroker_cutover.stat.exists

- name: Create worker cutover marker directory
  ansible.builtin.file:
    path: /var/lib/dark-factory-agent-worker
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: not worker_keybroker_cutover.stat.exists

- name: Record completion of the one-time Keybroker cutover
  ansible.builtin.file:
    path: /var/lib/dark-factory-agent-worker/keybroker-cutover-v1
    state: touch
    owner: root
    group: root
    mode: "0644"
  become: true
  when: not worker_keybroker_cutover.stat.exists

- name: Install the supervised worker systemd unit
  ansible.builtin.template:
    src: dark-factory-agent-worker.service.j2
    dest: /etc/systemd/system/dark-factory-agent-worker.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Reload systemd daemon
    - Restart dark-factory-agent-worker

- name: Enable and start the worker service
  ansible.builtin.systemd_service:
    name: dark-factory-agent-worker.service
    enabled: true
    state: started
    daemon_reload: true
  become: true
