---
- name: Require a worker id and role
  ansible.builtin.assert:
    that:
      - worker_id is defined
      - worker_id | length > 0
      - worker_role is defined
      - worker_role | length > 0
    fail_msg: "Set worker_id and worker_role for {{ inventory_hostname }} before running this playbook."

- name: Install Python, cron, CA certificates, and worker process-management packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3
      - python3-venv
      - cron
      - procps
    state: present
  become: true

- name: Create worker directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user_id }}"
    mode: "0700"
  loop:
    - "{{ ansible_user_dir }}/agent-worker"
    - "{{ ansible_user_dir }}/agent-workspace"
    - "{{ ansible_user_dir }}/.config"
    - "{{ ansible_user_dir }}/.config/litellm"

- name: Check Caddy root CA on the controller
  ansible.builtin.stat:
    path: "{{ caddy_root_ca_source }}"
  delegate_to: localhost
  register: caddy_root_ca_source_stat

- name: Require the Caddy root CA for HTTPS worker model access
  ansible.builtin.assert:
    that:
      - caddy_root_ca_source_stat.stat.exists
      - caddy_root_ca_source_stat.stat.isreg
    fail_msg: >-
      Export the active Caddy root certificate to {{ caddy_root_ca_source }}
      with scripts/export_caddy_root_ca.sh before deploying the worker.

- name: Install the Caddy root CA for worker model requests
  ansible.builtin.copy:
    src: "{{ caddy_root_ca_source }}"
    dest: "{{ ansible_user_dir }}/.config/litellm/caddy-root.crt"
    owner: "{{ ansible_user_id }}"
    mode: "0644"
  notify: Restart agent worker

- name: Install worker source
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../agent-worker/{{ item }}"
    dest: "{{ ansible_user_dir }}/agent-worker/{{ item }}"
    owner: "{{ ansible_user_id }}"
    mode: "0644"
  loop:
    - worker.py
    - requirements.txt
  notify: Restart agent worker

- name: Remove the retired in-process mission module
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/agent-worker/mission.py"
    state: absent

- name: Install OMP job image build context
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../agent-worker/omp-image/"
    dest: "{{ ansible_user_dir }}/agent-worker/omp-image/"
    owner: "{{ ansible_user_id }}"
    mode: preserve
  register: omp_image_source_copy
  notify: Restart agent worker

- name: Check whether the OMP job image exists
  ansible.builtin.command:
    argv:
      - docker
      - image
      - inspect
      - "{{ worker_omp_image }}"
  register: omp_worker_image_info
  changed_when: false
  failed_when: false

- name: Build the OMP job image
  ansible.builtin.command:
    argv:
      - docker
      - build
      - --pull
      - --tag
      - "{{ worker_omp_image }}"
      - "{{ ansible_user_dir }}/agent-worker/omp-image"
  when: omp_image_source_copy.changed or omp_worker_image_info.rc != 0
  notify: Restart agent worker


- name: Install worker Python dependencies
  ansible.builtin.pip:
    requirements: "{{ ansible_user_dir }}/agent-worker/requirements.txt"
    virtualenv: "{{ ansible_user_dir }}/agent-worker/.venv"
    virtualenv_command: python3 -m venv

- name: Install worker environment
  ansible.builtin.template:
    src: worker.env.j2
    dest: "{{ ansible_user_dir }}/agent-worker/worker.env"
    owner: "{{ ansible_user_id }}"
    mode: "0600"
  notify: Restart agent worker

- name: Install worker start script
  ansible.builtin.template:
    src: start-worker.sh.j2
    dest: "{{ ansible_user_dir }}/agent-worker/start-worker.sh"
    owner: "{{ ansible_user_id }}"
    mode: "0700"
  notify: Restart agent worker

- name: Check for a LiteLLM key on the controller
  ansible.builtin.stat:
    path: "{{ litellm_key_source | default('/does-not-exist') }}"
  delegate_to: localhost
  register: litellm_key_source_stat

- name: Require a worker-scoped LiteLLM key for dynamic missions
  ansible.builtin.assert:
    that:
      - worker_model_base_url | length == 0 or (litellm_key_source_stat.stat.exists | default(false))
      - worker_model_base_url | length == 0 or (litellm_key_source_stat.stat.isreg | default(false))
    fail_msg: "Dynamic worker missions require a worker-scoped LiteLLM key file in litellm_key_source."


- name: Install the worker LiteLLM key
  ansible.builtin.copy:
    src: "{{ litellm_key_source }}"
    dest: "{{ ansible_user_dir }}/.config/litellm/worker-api-key"
    owner: "{{ ansible_user_id }}"
    mode: "0600"
  no_log: true
  when:
    - litellm_key_source is defined
    - litellm_key_source | length > 0
    - litellm_key_source_stat.stat.exists
    - litellm_key_source_stat.stat.isreg
  notify: Restart agent worker

- name: Install Caddy root CA on the worker
  ansible.builtin.copy:
    src: "{{ caddy_root_ca_source }}"
    dest: /usr/local/share/ca-certificates/thegarden-caddy-root.crt
    owner: root
    group: root
    mode: "0644"
  become: true
  register: worker_system_ca_copy
  when: worker_model_base_url is match('^https://')

- name: Refresh worker CA trust store
  ansible.builtin.command: update-ca-certificates
  become: true
  changed_when: false
  when:
    - worker_model_base_url is match('^https://')
    - worker_system_ca_copy.changed

- name: Remove the legacy worker reboot cron job
  ansible.builtin.cron:
    name: thegarden-agent-worker
    special_time: reboot
    job: "{{ ansible_user_dir }}/agent-worker/start-worker.sh"
    state: absent

- name: Check whether the systemd worker service is active
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - --quiet
      - dark-factory-agent-worker
  register: worker_service_active
  changed_when: false
  failed_when: false

- name: Stop a legacy worker process before systemd takes over
  ansible.builtin.command:
    argv:
      - pkill
      - --signal
      - TERM
      - --uid
      - "{{ ansible_user_id }}"
      - --full
      - --
      - "{{ ansible_user_dir }}/agent-worker/(start-worker\\.sh|worker\\.py)"
  register: legacy_worker_stop
  changed_when: legacy_worker_stop.rc == 0
  failed_when: legacy_worker_stop.rc not in [0, 1]
  when: worker_service_active.rc != 0

- name: Wait for legacy worker processes to exit
  ansible.builtin.command:
    argv:
      - pgrep
      - --uid
      - "{{ ansible_user_id }}"
      - --full
      - "{{ ansible_user_dir }}/agent-worker/(start-worker\\.sh|worker\\.py)"
  register: legacy_worker_processes
  retries: 10
  delay: 1
  until: legacy_worker_processes.rc == 1
  changed_when: false
  failed_when: legacy_worker_processes.rc not in [0, 1]
  when: worker_service_active.rc != 0

- name: Install the worker systemd service
  ansible.builtin.template:
    src: dark-factory-agent-worker.service.j2
    dest: /etc/systemd/system/dark-factory-agent-worker.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart agent worker

- name: Enable and start the worker service
  ansible.builtin.systemd:
    name: dark-factory-agent-worker
    enabled: true
    state: started
    daemon_reload: true
  become: true
